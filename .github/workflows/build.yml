name: build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      java: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.java == 'true' }}
      ml: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ml == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            java:
              - "pom.xml"
              - "vistructum-*/**"
              - "models/**"
              - ".github/workflows/build.yml"
            ml:
              - "ml/**"
              - "models/**"
              - ".github/workflows/build.yml"
            docker:
              - "**/pom.xml"
              - "**/Dockerfile"
              - "docker-compose.yml"
              - ".dockerignore"
              - "models/**"
              - ".github/workflows/build.yml"

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B -q package

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements*.txt
            ml/train/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r train/requirements.txt
      - run: pip install --no-deps -e .
      - run: ruff check --line-length 120 .
      - run: python -m compileall -q parity.py release_manifest.py vistructum_ml train
      - run: python -m pytest -q tests train/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ml:${{ github.workspace }}/ml/train
      - name: smoke (generate, train, export, evaluate)
        working-directory: ml/train
        env:
          PYTHONPATH: ${{ github.workspace }}/ml:${{ github.workspace }}/ml/train
        run: |
          python -m generator.build --kind mask --out runs/data/smoke --train 64 --val 32 --test 32 --holdout 32 --workers 2 --seed 1
          python run.py --config configs/smoke.yaml --no-gate
          python -m generator.build --kind fullscan --out runs/data/smoke-scan --train 32 --val 16 --test 16 --holdout 16 --workers 2 --seed 2
          python run.py --config configs/smoke.yaml --set kind=fullscan --set data_dir=runs/data/smoke-scan --no-gate

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
