name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v1.0.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - run: mvn -B -q verify
      - name: assets
        run: |
          mkdir dist
          cp "vistructum-core/target/vistructum-$VERSION.jar" dist/
          cp "vistructum-ui/target/vistructum-ui-$VERSION.jar" dist/
          cp vistructum-sidecar/target/vistructum-sidecar.jar "dist/vistructum-sidecar-$VERSION.jar"
          cp "vistructum-ui/target/vistructum-resourcepack-$VERSION.zip" dist/
          (cd dist && sha256sum -- *.jar *.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publish
        run: |
          if [[ "$VERSION" == *-* ]]; then channel=(--prerelease); else channel=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false "${channel[@]}"
          else
            if [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then notes=(--notes-from-tag); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --verify-tag --title "Vistructum $VERSION" "${notes[@]}" "${channel[@]}"
          fi
