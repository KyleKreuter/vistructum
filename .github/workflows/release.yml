name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v1.0.0
        required: true
      targets:
        description: Where to publish
        type: choice
        options: [all, github, modrinth]
        default: all

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github:
    if: github.event_name == 'push' || inputs.targets != 'modrinth'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - run: mvn -B -q verify
      - name: assets
        run: |
          mkdir dist
          cp "vistructum-core/target/vistructum-$VERSION.jar" dist/
          cp "vistructum-ui/target/vistructum-ui-$VERSION.jar" dist/
          cp vistructum-sidecar/target/vistructum-sidecar.jar "dist/vistructum-sidecar-$VERSION.jar"
          cp "vistructum-ui/target/vistructum-resourcepack-$VERSION.zip" dist/
          (cd dist && sha256sum -- *.jar *.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publish
        run: |
          if [[ "$VERSION" == *-* ]]; then channel=(--prerelease); else channel=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false "${channel[@]}"
          else
            if [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then notes=(--notes-from-tag); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --verify-tag --title "Vistructum $VERSION" "${notes[@]}" "${channel[@]}"
          fi

  modrinth:
    needs: github
    if: always() && (needs.github.result == 'success' || needs.github.result == 'skipped') && (github.event_name == 'push' || inputs.targets != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: vistructum
      GAME_VERSIONS: '["1.21.4"]'
      LOADERS: '["paper"]'
      API: https://api.modrinth.com/v2
      AGENT: KyleKreuter/vistructum (release workflow)
    steps:
      - name: token
        run: |
          [[ -n "$MODRINTH_TOKEN" ]] || { echo "::error::secret MODRINTH_TOKEN is not set"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: assets
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "vistructum-$VERSION.jar" --pattern "vistructum-ui-$VERSION.jar"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > changelog.md
      - name: publish
        run: |
          modrinth() { curl -sS --fail-with-body -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $AGENT" "$@"; }
          query() { modrinth --retry 5 --retry-delay 5 --retry-all-errors "$@"; }
          project=$(query "$API/project/$MODRINTH_PROJECT")
          project=$(jq -er .id <<< "$project")
          versions=$(query "$API/project/$project/version")
          jq -e 'type == "array"' <<< "$versions" > /dev/null
          if jq -e --arg v "$VERSION" 'any(.[]; .version_number == $v)' <<< "$versions" > /dev/null; then
            echo "Modrinth already has $VERSION"
            exit 0
          fi
          case "$VERSION" in
            *-alpha*) type=alpha ;;
            *-*) type=beta ;;
            *) type=release ;;
          esac
          jq -n --arg project "$project" --arg version "$VERSION" --arg type "$type" \
            --rawfile changelog changelog.md --argjson games "$GAME_VERSIONS" --argjson loaders "$LOADERS" '{
              project_id: $project,
              version_number: $version,
              name: ("Vistructum " + $version),
              changelog: $changelog,
              version_type: $type,
              game_versions: $games,
              loaders: $loaders,
              dependencies: [],
              featured: ($type == "release"),
              file_parts: ["core", "ui"],
              primary_file: "core"
            }' > version.json
          modrinth -X POST "$API/version" \
            -F "data=@version.json;type=application/json" \
            -F "core=@dist/vistructum-$VERSION.jar" \
            -F "ui=@dist/vistructum-ui-$VERSION.jar" | jq '{id, version_number, version_type, files: [.files[].filename]}'
