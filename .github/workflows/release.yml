name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v1.0.0
        required: true
      targets:
        description: Where to publish
        type: choice
        options: [all, github, modrinth]
        default: all

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github:
    if: github.event_name == 'push' || inputs.targets != 'modrinth'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] && ! git tag -l --format='%(contents)' "$TAG" | grep -q '^## '; then
            echo "::error::the message of $TAG has no '## ' heading; create the tag with git tag -a --cleanup=verbatim"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - run: mvn -B -q verify
      - name: assets
        run: |
          mkdir dist
          cp "vistructum-core/target/vistructum-$VERSION.jar" dist/
          cp "vistructum-ui/target/vistructum-ui-$VERSION.jar" dist/
          cp vistructum-sidecar/target/vistructum-sidecar.jar "dist/vistructum-sidecar-$VERSION.jar"
          cp "vistructum-ui/target/vistructum-resourcepack-$VERSION.zip" dist/
          (cd dist && sha256sum -- *.jar *.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publish
        run: |
          if [[ "$VERSION" == *-* ]]; then channel=(--prerelease); else channel=(--latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false "${channel[@]}"
          else
            if [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then notes=(--notes-from-tag); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --verify-tag --title "Vistructum $VERSION" "${notes[@]}" "${channel[@]}"
          fi

  modrinth:
    needs: github
    if: always() && (needs.github.result == 'success' || needs.github.result == 'skipped') && (github.event_name == 'push' || inputs.targets != 'github')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: vistructum
      MODRINTH_CORE_PROJECT: vistructum-core
      CORE_DEPENDENCIES: '[{"project_id":"Lu3KuzdV","dependency_type":"optional"}]'
      UI_DEPENDENCIES: '[{"project_id":"PgXAUxLZ","dependency_type":"optional"},{"project_id":"P1OZGk5p","dependency_type":"optional"},{"project_id":"NpvuJQoq","dependency_type":"optional"}]'
      GAME_LINE: "1.21"
      LOADERS: '["paper"]'
      API: https://api.modrinth.com/v2
      AGENT: KyleKreuter/vistructum (release workflow)
    steps:
      - name: token
        run: |
          [[ -n "$MODRINTH_TOKEN" ]] || { echo "::error::secret MODRINTH_TOKEN is not set"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: assets
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "vistructum-$VERSION.jar" --pattern "vistructum-ui-$VERSION.jar"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > changelog.md
      - name: publish
        run: |
          modrinth() { curl -sS --fail-with-body -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $AGENT" "$@"; }
          query() { modrinth --retry 5 --retry-delay 5 --retry-all-errors "$@"; }
          games=$(query "$API/tag/game_version")
          games=$(jq -ec --arg line "$GAME_LINE" \
            '[.[] | select(.version_type == "release" and (.version == $line or (.version | startswith($line + "."))))
              | .version] | select(length > 0)' <<< "$games")
          case "$VERSION" in
            *-alpha*) type=alpha ;;
            *-*) type=beta ;;
            *) type=release ;;
          esac
          publish() {
            local slug=$1 title=$2 file=$3 dependencies=$4 project versions existing
            project=$(query "$API/project/$slug" | jq -er .id)
            versions=$(query "$API/project/$project/version")
            existing=$(jq -r --arg v "$VERSION" 'map(select(.version_number == $v)) | first | .id // empty' <<< "$versions")
            if [[ -n "$existing" ]]; then
              echo "Modrinth project $slug already has $VERSION" >&2
              echo "$existing"
              return
            fi
            jq -n --arg project "$project" --arg version "$VERSION" --arg type "$type" --arg title "$title" \
              --rawfile changelog changelog.md --argjson games "$games" --argjson loaders "$LOADERS" \
              --argjson dependencies "$dependencies" '{
                project_id: $project,
                version_number: $version,
                name: ($title + " " + $version),
                changelog: $changelog,
                version_type: $type,
                game_versions: $games,
                loaders: $loaders,
                dependencies: $dependencies,
                featured: ($type == "release"),
                file_parts: ["jar"],
                primary_file: "jar"
              }' > version.json
            modrinth -X POST "$API/version" \
              -F "data=@version.json;type=application/json" \
              -F "jar=@$file" | tee /dev/stderr | jq -er .id
          }
          core=$(publish "$MODRINTH_CORE_PROJECT" "Vistructum Core" "dist/vistructum-$VERSION.jar" "$CORE_DEPENDENCIES")
          ui_dependencies=$(jq -c --arg core "$core" '[{project_id: "nOum8t4d", version_id: $core, dependency_type: "required"}] + .' <<< "$UI_DEPENDENCIES")
          publish "$MODRINTH_PROJECT" "Vistructum" "dist/vistructum-ui-$VERSION.jar" "$ui_dependencies" > /dev/null
