name: scan-stage
run-name: scan stage ${{ inputs.run }}

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Run directory on the scan-runs branch, e.g. 20260927-120000-0b8abf31/scan-v1-0b8abf31"
        required: true
      shards:
        description: "Parallel jobs per phase (1-16)"
        required: true
        default: "16"
  workflow_call:
    inputs:
      run:
        type: string
        required: true
      shards:
        type: string
        required: false
        default: "16"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/ml:${{ github.workspace }}/ml/train
  SHARDS: ${{ inputs.shards }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      key: ${{ steps.shards.outputs.key }}
    steps:
      - name: validate inputs
        env:
          RUN: ${{ inputs.run }}
        run: |
          [[ "$RUN" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::run must be <label>/<run>"; exit 1; }
          [[ "$SHARDS" =~ ^[0-9]+$ ]] && (( SHARDS >= 1 && SHARDS <= 16 )) || { echo "::error::shards must be 1-16"; exit 1; }
      - id: shards
        env:
          RUN: ${{ inputs.run }}
        run: |
          echo "list=[$(seq -s, 0 $((SHARDS - 1)))]" >> "$GITHUB_OUTPUT"
          echo "key=${RUN##*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: scan-runs
          path: scan-runs
          sparse-checkout: ${{ inputs.run }}
          sparse-checkout-cone-mode: false
      - env:
          RUN: ${{ inputs.run }}
        run: |
          test -f "scan-runs/$RUN/manifest.json" || { echo "::error::no manifest.json in scan-runs/$RUN"; exit 1; }
          mkdir run
          cp "scan-runs/$RUN/manifest.json" "scan-runs/$RUN"/*.onnx run/
      - uses: actions/upload-artifact@v4
        with:
          name: input-${{ steps.shards.outputs.key }}
          path: run
          retention-days: 1

  calib:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/train/requirements-scan.txt
      - run: pip install -r ml/train/requirements-scan.txt
      - uses: actions/download-artifact@v4
        with:
          name: input-${{ needs.prepare.outputs.key }}
          path: run
      - run: python ml/train/scan_stage.py collect run --phase calib --shard "${{ matrix.shard }}/$SHARDS" --out "calib-${{ matrix.shard }}.pkl"
      - uses: actions/upload-artifact@v4
        with:
          name: calib-${{ needs.prepare.outputs.key }}-${{ matrix.shard }}
          path: calib-${{ matrix.shard }}.pkl
          retention-days: 1

  calibrate:
    needs: [prepare, calib]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/train/requirements-scan.txt
      - run: pip install -r ml/train/requirements-scan.txt
      - uses: actions/download-artifact@v4
        with:
          name: input-${{ needs.prepare.outputs.key }}
          path: run
      - uses: actions/download-artifact@v4
        with:
          pattern: calib-${{ needs.prepare.outputs.key }}-*
          path: shards
          merge-multiple: true
      - run: |
          set +e
          python ml/train/scan_stage.py merge run --phase calib shards/calib-*.pkl
          code=$?
          (( code <= 1 )) || exit "$code"
          (( code == 0 )) || echo "::warning::no threshold meets the scan gate on calib, the model keeps its threshold"
      - uses: actions/upload-artifact@v4
        with:
          name: calibrated-${{ needs.prepare.outputs.key }}
          path: run
          retention-days: 1

  scan:
    needs: [prepare, calibrate]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/train/requirements-scan.txt
      - run: pip install -r ml/train/requirements-scan.txt
      - uses: actions/download-artifact@v4
        with:
          name: calibrated-${{ needs.prepare.outputs.key }}
          path: run
      - run: python ml/train/scan_stage.py collect run --phase scan --shard "${{ matrix.shard }}/$SHARDS" --out "scan-${{ matrix.shard }}.pkl"
      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ needs.prepare.outputs.key }}-${{ matrix.shard }}
          path: scan-${{ matrix.shard }}.pkl
          retention-days: 1

  finish:
    needs: [prepare, scan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/train/requirements-scan.txt
      - run: pip install -r ml/train/requirements-scan.txt
      - uses: actions/download-artifact@v4
        with:
          name: calibrated-${{ needs.prepare.outputs.key }}
          path: run
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-${{ needs.prepare.outputs.key }}-*
          path: shards
          merge-multiple: true
      - env:
          RUN: ${{ inputs.run }}
        run: |
          set +e
          python ml/train/scan_stage.py merge run --phase scan shards/scan-*.pkl | tee verdict.json
          code=${PIPESTATUS[0]}
          (( code <= 1 )) || exit "$code"
          {
            echo "### Scan stage $RUN: $(jq -r .verdict verdict.json)"
            jq -r '.failures[]? | "- \(.)"' verdict.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ needs.prepare.outputs.key }}
          path: run
          retention-days: 30
