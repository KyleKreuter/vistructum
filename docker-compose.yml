services:
  sidecar:
    build:
      context: .
      dockerfile: vistructum-sidecar/Dockerfile
    hostname: sidecar
    ports:
      - "127.0.0.1:${SIDECAR_PORT:-8000}:8000"
    volumes:
      - sidecar-models:/models
    environment:
      ORT_THREADS: "${ORT_THREADS:-1}"
      MODELS_UPDATE: "${MODELS_UPDATE:-auto}"
      MODELS_REPOSITORY: "${MODELS_REPOSITORY:-KyleKreuter/vistructum}"
      MODELS_CHECK_HOURS: "${MODELS_CHECK_HOURS:-24}"

  server:
    build:
      context: .
      dockerfile: vistructum-core/Dockerfile
    ports:
      - "25565:25565"
      - "${PACK_PORT:-8765}:8765"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.4"
      MEMORY: 2G
      ONLINE_MODE: "FALSE"
      SIDECAR_HOST: sidecar
      SIDECAR_PORT: "8000"
      MODRINTH_PROJECTS: "${MODRINTH_PROJECTS:-viaversion,viabackwards}"
    volumes:
      - vistructum-state:/data/plugins/vistructum
      - vistructum-ui-config:/data/plugins/vistructum-ui

volumes:
  sidecar-models:
  vistructum-state:
  vistructum-ui-config:
