services:
  sidecar:
    build: ./sidecar
    hostname: sidecar
    ports:
      - "127.0.0.1:${SIDECAR_PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./captures:/captures
    environment:
      ORT_THREADS: "${ORT_THREADS:-1}"
      CAPTURE_DIR: "${CAPTURE_DIR:-}"
      CAPTURE_MAX: "${CAPTURE_MAX:-20000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  server:
    build:
      context: .
      dockerfile: vistructum-core/Dockerfile
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.4"
      MEMORY: 2G
      ONLINE_MODE: "FALSE"
      SIDECAR_HOST: sidecar
      SIDECAR_PORT: "8000"
    volumes:
      - vistructum-state:/data/plugins/vistructum
    depends_on:
      sidecar:
        condition: service_healthy

volumes:
  vistructum-state:
