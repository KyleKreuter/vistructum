[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vistructum-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["vistructum_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
