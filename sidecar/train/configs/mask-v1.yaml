kind: mask
data_dir: runs/data/mask-v1
out_dir: runs/mask-v1
widths: [16, 32, 64]
dropout: 0.1
epochs: 30
batch: 256
optimizer: adamw
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 2
label_smoothing: 0.05
focal_gamma: 0.0
ema_decay: 0.999
pos_weight: 1.0
augment_d4: true
device: cpu
seed: 42
num_threads: 4
quantize: true
