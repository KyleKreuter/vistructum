database:
  file: vistructum.db

inference:
  mode: local
  fallback: none
  threads: 1

# Looks for new plugin and model releases every check-hours and logs when one is available.
# Set auto-update-models to true to download and activate new models automatically.
updates:
  auto-update-models: false
  repository: KyleKreuter/vistructum
  check-hours: 24

sidecar:
  host: 127.0.0.1
  port: 8000
  connect-timeout-seconds: 3
  request-timeout-seconds: 120

tracking:
  ttl-minutes: 10
  link-distance: 3
  quiet-seconds: 20
  min-blocks: 12
  max-extent: 256
  poll-seconds: 5

scan:
  enabled: true
  daily-at: "04:00"
  worlds:
    - world
    - world_nether
    - world_the_end
  chunks-per-tick: 8
  workers: 2
  volume:
    filler-share: 0.10

alerts:
  dedupe-days: 14

# Records player movement and secures block changes, the prior block states and nearby players as evidence
# when the live check creates a finding.
recording:
  enabled: false
  radius: 32
  lead-seconds: 30
  margin: 4

# Reads CoreProtect's block log for findings without tracked block changes, mostly those of the full scan. The
# players who placed the blocks become the players of the finding, and the logged changes are secured as evidence.
integrations:
  coreprotect:
    enabled: true
    lookup-days: 30
    timeout-seconds: 10

retention:
  reviewed-days: 90
  confirmed-days: 365
