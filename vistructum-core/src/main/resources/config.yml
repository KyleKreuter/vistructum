database:
  file: vistructum.db

inference:
  mode: local
  fallback: none
  threads: 1

models:
  update: auto
  repository: KyleKreuter/vistructum
  check-hours: 24

sidecar:
  host: 127.0.0.1
  port: 8000
  connect-timeout-seconds: 3
  request-timeout-seconds: 120

tracking:
  ttl-minutes: 10
  link-distance: 3
  quiet-seconds: 20
  min-blocks: 12
  max-extent: 256
  poll-seconds: 5

scan:
  enabled: true
  daily-at: "04:00"
  worlds:
    - world
    - world_nether
    - world_the_end
  chunks-per-tick: 8
  workers: 2
  volume:
    filler-share: 0.10

alerts:
  dedupe-days: 14

retention:
  reviewed-days: 90
