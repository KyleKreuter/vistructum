trigger:
  standard-n: 40
  standard-threshold: 0.85
  small-n: 15
  small-threshold: 0.95
  window-minutes: 5
  density-coverage: 0.35
  periodicity-peak: 0.6

tracking:
  ttl-minutes: 10

model:
  mask-version: bf-mask-1
  scan-version: bf-scan-2
  feature-spec: fs-1
  sidecar-host: 127.0.0.1
  sidecar-port: 8000

outbox:
  path: plugins/vistructum/outbox.db
  poll-interval-seconds: 2

scan:
  chunks-per-tick: 4
  tile-size: 64
  tile-stride: 48
  bbox-cap: 256

review:
  permission: vistructum.staff
  snapshots-per-player-per-hour: 10
  max-pending-queue: 500
