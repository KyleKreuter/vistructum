pack:
  bind-port: 8765
  public-url: "http://localhost:8765/pack.zip"

web:
  enabled: false
  bind-address: "0.0.0.0"
  public-url: "http://localhost:8765"
  textures:
    # true downloads the Minecraft client jar of the running version from Mojang and serves its block and item
    # textures and models to the web app. Setting it to true means you accept the Minecraft EULA:
    # https://aka.ms/MinecraftEULA
    download: false

list:
  map-previews: false

punishments:
  # Shows the bans, mutes, warnings and kicks of players from LibertyBans in the web app.
  enabled: true

discord:
  enabled: false
  # The webhook URL from Server Settings > Integrations > Webhooks. Treat it as a secret.
  webhook-url: ""
  events:
    created: true
    reviewed: true
    scan-finished: false
  # Findings below this probability (0 to 1) are not announced.
  min-probability: 0.0
  # Role ID pinged on new findings, empty for no ping.
  mention-role: ""
