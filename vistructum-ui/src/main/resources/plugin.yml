name: vistructum-ui
version: '${project.version}'
main: de.kylekreuter.vistructum.ui.VistructumUi
api-version: '1.21'
author: Kyle Kreuter
description: Review menu and chat output for Vistructum findings, built on the Vistructum API.
depend: [vistructum]
commands:
  vis:
    description: Findings, reviews and scans
    usage: /vis [status|review|show|tp|confirm|falsealarm|stats|scan|export]
    aliases: [vistructum]
    permission: vistructum.staff
permissions:
  vistructum.staff:
    description: Receives findings in chat, lists, views and reviews them, shows the precision per source
    default: op
  vistructum.admin:
    description: Starts and stops surface scans, exports reviewed findings as training data
    default: op
    children:
      vistructum.staff: true
